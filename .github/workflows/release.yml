# Push a tag equal to manifest.json's version (git tag 1.0.1 && git push origin 1.0.1)
# and this builds main.js and publishes the GitHub Release the app installs from.
name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    uses: Venari-Hunt/noctivago-plugins/.github/workflows/plugin-release.yml@main
